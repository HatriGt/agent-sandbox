# agent-sandbox HTTP MCP controller — Dokploy / Docker Compose.
# Exposes the MCP endpoint via Traefik. The container does NOT run msb (msb needs KVM/microVMs on
# the host); it SSHes to the host to drive msb. All site-specific values come from .env so this
# file is safe to publish and reuse. See .env.example + `npm run setup`.
services:
  agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-sandbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Bind all interfaces INSIDE the container so Traefik (compose network) can reach it.
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8787"
    # Lets the container reach the host's sshd as host.docker.internal (portable; no hardcoded IP).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SSH key to reach the VPS host and run msb. Read-only. Path is gitignored (deploy/).
      - ./deploy/id_ed25519:/root/.ssh/id_ed25519:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      # ASB_DOMAIN comes from .env, e.g. agent-sandbox.example.com — set your own.
      - traefik.http.routers.agent-sandbox.rule=Host(`${ASB_DOMAIN}`)
      - traefik.http.routers.agent-sandbox.entrypoints=websecure
      - traefik.http.routers.agent-sandbox.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.agent-sandbox.loadbalancer.server.port=8787
    networks:
      - default
networks:
  default:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true
