name: Bug report
description: Something behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report security vulnerabilities here** — use
        [private reporting](https://github.com/HatriGt/agent-sandbox/security/advisories/new) instead.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - stdio entry (Cursor spawns it)
        - HTTP entry (/mcp or the JSON routes)
        - web console (/dashboard)
        - in-box agent / guard hooks
        - deploy + setup.sh
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. delegate({ source: "git", repo: "...", task: "..." })
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Output of `monitor`/`status`, the agent log tail, or the controller's stderr. **Redact tokens.**
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit / version
      placeholder: git rev-parse --short HEAD
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 22.3, microsandbox v0.6.9, Ubuntu 24.04 VPS"
